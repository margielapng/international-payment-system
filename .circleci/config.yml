version: 2.1

orbs:
  node: circleci/node@5.2.0
  docker: circleci/docker@2.6.0
  sonarcloud: sonarsource/sonarcloud@2.0.0

executors:
  node-executor:
    docker:
      - image: cimg/node:20.11.0
    working_directory: ~/project

jobs:
  # Install dependencies and cache
  install-dependencies:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
            - v1-dependencies-
      - run:
          name: Install Dependencies
          command: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  # Lint code
  lint:
    executor: node-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Run ESLint
          command: npm run lint
      - run:
          name: Check TypeScript
          command: npx tsc --noEmit

  # Run unit tests
  test-unit:
    executor: node-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Run Unit Tests
          command: npm run test:unit
      - run:
          name: Generate Coverage Report
          command: npm run test:coverage
      - store_test_results:
          path: ./coverage
      - store_artifacts:
          path: ./coverage
          destination: coverage

  # Run integration tests
  test-integration:
    executor: node-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Run Integration Tests
          command: npm run test:integration
      - store_test_results:
          path: ./test-results

  # Security audit
  security-audit:
    executor: node-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: NPM Audit
          command: npm audit --audit-level=moderate
      - run:
          name: Check for Vulnerabilities
          command: npx snyk test --severity-threshold=high || true

  # SonarQube analysis
  sonarqube-scan:
    executor: node-executor
    steps:
      - attach_workspace:
          at: ~/project
      - sonarcloud/scan:
          cache_version: 1
          scanner_version: 5.0.1

  # Build application
  build:
    executor: node-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Build Next.js Application
          command: npm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - .next
            - public

  # Build Docker image
  build-docker:
    executor: docker/docker
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - docker/check
      - docker/build:
          image: international-payment-system
          tag: ${CIRCLE_SHA1},latest
      - docker/push:
          image: international-payment-system
          tag: ${CIRCLE_SHA1},latest

  # Deploy to production
  deploy-production:
    executor: node-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Deploy to Vercel
          command: |
            npm install -g vercel
            vercel --prod --token=$VERCEL_TOKEN --yes

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - install-dependencies
      
      - lint:
          requires:
            - install-dependencies
      
      - test-unit:
          requires:
            - install-dependencies
      
      - test-integration:
          requires:
            - install-dependencies
      
      - security-audit:
          requires:
            - install-dependencies
      
      - sonarqube-scan:
          requires:
            - install-dependencies
            - test-unit
          context: sonarcloud
      
      - build:
          requires:
            - lint
            - test-unit
            - test-integration
            - security-audit
      
      - build-docker:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - develop
      
      - deploy-production:
          requires:
            - build
            - sonarqube-scan
          filters:
            branches:
              only: main

  # Nightly security scan
  nightly-security:
    triggers:
      - schedule:
          cron: "0 2 * * *"
          filters:
            branches:
              only: main
    jobs:
      - install-dependencies
      - security-audit:
          requires:
            - install-dependencies
