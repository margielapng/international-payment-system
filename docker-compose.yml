version: '3.8'

services:
  mongodb:
    image: mongo:6.0-alpine
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db
    networks:
      - secure-payments

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://admin:admin@mongodb:27017/secure-payments
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - secure-payments
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - secure-payments

volumes:
  mongodb_data:

networks:
  secure-payments:
    driver: bridge
