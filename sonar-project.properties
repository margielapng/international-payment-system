# Project identification
sonar.projectKey=international-payment-system
sonar.projectName=International Payment System
sonar.projectVersion=3.0.0
sonar.organization=your-org

# Source code location
sonar.sources=app,lib,components
sonar.tests=tests,__tests__

# Exclusions
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**,**/build/**,**/*.config.js,**/*.config.ts

# Test exclusions
sonar.test.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**,**/__tests__/**

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Quality Gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Code Smells
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# Ignore console.log in development
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2228
sonar.issue.ignore.multicriteria.e2.resourceKey=**/dev/**

# Ignore complexity in test files
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.test.ts

# Security Hotspots
sonar.security.hotspots.enabled=true

# Duplication
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx

# Analysis parameters
sonar.scm.provider=git
sonar.links.homepage=https://github.com/your-org/international-payment-system
sonar.links.ci=https://circleci.com/gh/your-org/international-payment-system
sonar.links.issue=https://github.com/your-org/international-payment-system/issues
sonar.links.scm=https://github.com/your-org/international-payment-system

# JavaScript/TypeScript specific
sonar.javascript.node.maxspace=4096
sonar.typescript.tsconfigPath=tsconfig.json

# Code coverage thresholds
sonar.coverage.minimum=80
sonar.coverage.exclusions=**/*.config.js,**/*.config.ts,**/types/**
